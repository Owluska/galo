galo:
  ros__parameters:
    node:
      debug: 1
      max_ground_map_frames: 15
      max_planar_map_frames: 15

    frames:
      imu_frame: "imu"
      lidar_frame: "rslidar"

    gnss_covariance:
      x_precision: 0.03
      y_precision: 0.03
      z_precision: 0.03
      roll_precision: 5.0
      pitch_precision: 5.0
      yaw_precision: 5.0

    lidar_covariance:
      base_xy: 0.1
      z: 0.2
      scale: 1.0
      roll: 0.5
      pitch: 0.5

    deskew:
      imu_queue_size: 1000
      lidar_queue_size: 10
      scan_period: 0.1
      stamp_is_scan_end: true
      log_throttle: 2000
      debug: 0

    ground_segmentation:
      cell_size: 1.0
      min_range: 2.0
      max_range: 80.0
      ground_height_threshold: 0.35
      min_points_per_cell: 3
      ground_min_height: -0.15

    ground_patch:
      cell_size: 4.0
      min_points: 8
      max_thickness: 0.35
      min_normal_z: 0.85
      max_surface_variation: 0.03

    ground_registration:
      max_match_distance: 5.0
      min_normal_dot: 0.75
      max_iterations: 10
      min_matches: 10
      max_dz: 0.1
      max_roll: 0.02
      max_pitch: 0.02
      damping_z: 0.001
      damping_roll: 0.01
      damping_pitch: 0.01
      min_x_span_for_pitch: 8.0
      min_y_span_for_roll: 6.0
      imu_roll_weight: 100.0
      imu_pitch_weight: 100.0
      use_imu_prior: true
      log_throttle: 2000
      max_match_z_difference: 0.8

    planar_registration:
      voxel_size: 1.0
      max_match_distance: 1.0
      min_points_per_voxel: 8
      max_iterations: 15
      min_matches: 20
      damping: 0.0001
      max_dx: 1.0
      max_dy: 1.0
      max_dyaw: 0.2
      max_dx_step: 0.5
      max_dy_step: 0.5
      max_dyaw_step: 0.1
      convergence_eps: 0.00001